[project]
name = "open-vigil"
version = "0.1.0"
description = "Automated symbolic verification for mobile GUI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Luca Yu", email = "lucayu@connect.hku.hk" }]
keywords = ["gui-agent", "verification", "efsm", "neuro-symbolic", "android"]
dependencies = [
    "adbutils>=2.0",
    "androguard>=4.1.3",
    "httpx>=0.27",
    "lark>=1.1",
    "loguru>=0.7",
    "networkx>=3.2",
    "openai>=1.50",
    "Pillow>=10.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "uiautomator2>=3.0",
]

[project.scripts]
vigil-explore = "vigil.scripts.explore_app:main"
vigil-build = "vigil.scripts.build_fsm:main"
vigil-verify-action = "vigil.scripts.verify_action:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.hatch.build.targets.wheel.force-include]
"src/vigil/system_prompt/transition_guard_generation.spec" = "vigil/system_prompt/transition_guard_generation.spec"
"src/vigil/system_prompt/invariant_guard_generation.spec" = "vigil/system_prompt/invariant_guard_generation.spec"
"src/vigil/symbolic/dsl_grammar.lark" = "vigil/symbolic/dsl_grammar.lark"
"src/vigil/core/android_platform.yaml" = "vigil/core/android_platform.yaml"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
